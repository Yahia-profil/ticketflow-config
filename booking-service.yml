server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,circuitbreakers,circuitbreakerevents

ticketflow:
  booking:
    hold-duration: PT15M
    sweep-interval: 60000
  clients:
    event-service:
      # Empty = resolve event-service through Eureka. Set EVENT_SERVICE_URL to bypass it
      # (e.g. http://localhost:8082 when only event-service runs locally).
      url: ${EVENT_SERVICE_URL:}

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
      # Resilience (TP5): the EventClient call goes through a Resilience4J circuit breaker.
      # group.enabled = one circuit for the whole client, not one per method.
      circuitbreaker:
        enabled: true
        group:
          enabled: true

# Instance EventClient#getById(Long) -> EventClientgetByIdLong (alphanumeric ids enabled):
# 10-call sliding window, verdict after 5 recorded calls, opens at 50% failures, stays
# open 10s, then lets 3 test calls through. 404/400 are ignored, not counted.
resilience4j:
  circuitbreaker:
    instances:
      EventClientgetByIdLong:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
  timelimiter:
    configs:
      default:
        timeout-duration: 4s
